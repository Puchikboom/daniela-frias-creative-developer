name: Portfolio preview build
on:
  push:
    branches: [feature/engineering-case-studies]
  pull_request:
    paths:
      - "src/**"
      - "package*.json"
      - ".github/workflows/portfolio-preview.yml"
jobs:
  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

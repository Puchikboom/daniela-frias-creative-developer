name: Engineering labs checks

on:
  push:
    branches: [feature/engineering-portfolio]
    paths:
      - "labs/**"
      - ".github/workflows/engineering-labs.yml"
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/engineering-labs.yml"

jobs:
  portfolio:
    name: Astro production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  frontend:
    name: React TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/pulse-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build

  php:
    name: PHP source syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP files
        run: |
          php -v
          php -l labs/pulse-studio/api/router.php
          php -l labs/pulse-studio/api/seed.php
          php -l labs/forma-studio/forma-studio.php

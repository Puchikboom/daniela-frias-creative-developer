name: Engineering labs checks
on:
  push:
    paths: ["labs/**", "src/**", "public/threadlab/**", "public/data-lab/**", "tests/**", "scripts/**", "package.json", ".github/workflows/engineering-labs.yml"]
  pull_request:
    paths: ["labs/**", "src/**", "public/threadlab/**", "tests/**", "scripts/**", ".github/workflows/engineering-labs.yml"]
jobs:
  portfolio:
    name: Astro + safe Pulse static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install main dependencies
        run: npm ci --no-audit --no-fund
      - name: Build integrated website with safe demo
        run: npm run build
      - name: Ensure PHP and SQLite never ship
        run: |
          test -f dist/pulse-studio/index.html
          test -f dist/react-api-studio/index.html
          test -f dist/react-api-studio/catalog.json
          test ! -e dist/pulse-studio/api/router.php
          if find dist/pulse-studio -name '*.php' -o -name '*.sqlite' | grep .; then exit 1; fi
  browser-qa:
    name: ThreadLab Chromium functional + responsive QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro website with independent Pulse demo
        run: npm run build
      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test mobile and desktop interactions
        run: node tests/threadlab.browser.mjs
      - name: Audit EN and ES WCAG 2.1 A/AA
        run: node tests/threadlab.a11y.mjs
      - name: Test bilingual Data Lab product interactions and accessibility
        run: node tests/data-lab.browser.mjs
      - name: Test React API Studio requests recovery responsive layout and WCAG
        run: node tests/react-api-studio.browser.mjs
      - name: Audit technical expertise in Home and About (EN/ES)
        run: node tests/technical-expertise.browser.mjs
      - name: Test Pulse Studio 2.0 analytics and accessibility
        run: node tests/pulse-studio.browser.mjs
      - name: Audit portfolio routes, contact accessibility and capture mobile tablet desktop
        run: node tests/portfolio-quality.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threadlab-browser-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore
  threadlab:
    name: ThreadLab configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/threadlab.test.mjs tests/data-lab.test.mjs
  frontend:
    name: React TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/pulse-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Build static browser demo (no PHP)
        run: npm run build:demo
  wordpress-integration:
    name: Forma WordPress real integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: forma_test_pw
          MYSQL_DATABASE: forma_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pforma_test_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure WP PHP extensions and CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql php-xml php-mbstring php-curl
          curl -fLsS https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo install -m 755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --info
      - name: Verify plugin in a disposable WordPress installation
        run: bash labs/forma-studio/tests/wordpress-integration.sh
  php:
    name: PHP source syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          php -l labs/pulse-studio/api/router.php
          php -l labs/pulse-studio/api/seed.php
          php -l labs/forma-studio/forma-studio.php

  api-integration:
    name: Pulse PHP CRUD integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP runtime
        run: php -v
      - name: Ensure SQLite extension
        run: |
          if ! php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"; then
            sudo apt-get update -qq
            sudo apt-get install -y php-sqlite3
          fi
      - name: End-to-end CRUD and validation smoke test
        run: python3 -m unittest discover -s labs/pulse-studio/tests -p 'test_*.py' -v
